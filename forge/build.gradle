plugins {
    id 'com.gradleup.shadow'
}

loom {
    forge {
        mixinConfig 'guildquests.mixins.json'
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

base {
    archivesName = 'guildquests_forge-1.20.1'
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    modCompileOnly "maven.modrinth:create:$rootProject.create_forge_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    from(rootProject.file('LICENSE')) {
        rename { "${it}_guildquests" }
    }
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

tasks.matching { it.name == 'remapJar' }.configureEach {
    doLast {
        def f = archiveFile.get().asFile
        def name = f.name
        def idx = name.lastIndexOf('-')
        if (idx > 0) {
            def target = new File(f.parentFile, name.substring(0, idx) + '_' + name.substring(idx + 1))
            if (target.exists()) {
                target.delete()
            }
            f.renameTo(target)
        }
    }
}
