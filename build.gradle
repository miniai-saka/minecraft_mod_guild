plugins {
    id 'fabric-loom' version '1.10.5'
    id 'maven-publish'
}

version = project.mod_version
group = project.group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = "curse maven"
        url = "https://cursemaven.com"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modCompileOnly "curse.maven:create-fabric-624165:7286603"

    modCompileOnly fileTree(dir: 'libs/nested-mods', include: '*.jar')
    testImplementation 'junit:junit:4.13.2'
}

test { useJUnit() }

tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
}

loom {
    runs {
        client { vmArg '-Dguildquests.disableUpdateCheck=true' }
    }
}

// Optional local smoke-test mod. Its classes and resources are never included in the release JAR.
if (project.hasProperty('fxDebug')) {
    sourceSets {
        fxDebug {
            compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
            runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
        }
    }
    loom {
        mods {
            guildquests { sourceSet sourceSets.main }
            guildquests_fx_debug { sourceSet sourceSets.fxDebug }
        }
        runs {
            client {
                runDir '../../work/fx-debug-client'
                programArgs '--width', '1600', '--height', '1000', '--username', 'FxTester'
            }
            server { runDir '../../work/fx-debug-server' }
        }
    }
    tasks.matching { it.name == 'runClient' || it.name == 'runServer' }.configureEach {
        dependsOn tasks.named('fxDebugClasses')
        classpath += sourceSets.fxDebug.output
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = 'UTF-8'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// Declare the final name so Gradle can track the output and reproduce the build.
tasks.matching { it.name == 'remapJar' }.configureEach {
    archiveFileName = "${project.archives_base_name}_${project.version}.jar"
}

