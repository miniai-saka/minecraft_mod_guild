// Opt-in engine integration driver. It is never included in the production mod.
sourceSets {
    guiDebug {
        java.srcDir rootProject.file('common/src/guiDebug/java')
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
tasks.register('guiDebugJar', Jar) {
    dependsOn tasks.named('guiDebugClasses')
    from sourceSets.guiDebug.output
    archiveClassifier = 'gui-debug-dev'
}
tasks.register('remapGuiDebugJar', tasks.named('remapJar').get().getClass().getSuperclass()) {
    dependsOn tasks.named('guiDebugJar')
    inputFile.set(tasks.named('guiDebugJar', Jar).flatMap { it.archiveFile })
    archiveClassifier = 'gui-debug'
    addNestedDependencies = false
}
